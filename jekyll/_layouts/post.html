---
layout: base
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <style>
    hr {
        display: block;
        height: 1px;
        border: 0;
        border-top: 1px solid #dddddd;
        margin: 1em 0;
        padding: 0;
    }
  </style>

  <h1>{{ page.title }}</h1>

  <p>By {{ page.author }} written on {{ page.post_date date: "%Y/%m/%d" | date: "%B %d, %Y"}} in {{page.topic }}</p>
    <hr>

  {% if page.post_date != page.update_date%}
    <p>Updated on {{ page.update_date | date: "%Y/%m/%d" | date: "%B %d, %Y"}}</p>
  {% endif %}

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

</article>
